<style>
@font-face{font-family:"Helvena";src:local("Helvena Regular"),url("assets/fonts/Helvena-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Helvena";src:local("Helvena Bold"),url("assets/fonts/Helvena-Bold.otf") format("opentype");font-weight:700;font-display:swap}
:root{
  --rojo:#CC1717; --manteca:#F4E9CE; --azul:#1B2E6B;
  --azul-suave:rgba(27,46,107,.82);
  --linea:rgba(27,46,107,.14);
  --gutter:clamp(16px,5vw,40px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--manteca);color:var(--azul);font-family:"Helvena","Inter",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--azul);color:var(--manteca);padding:10px 14px;z-index:100}
.skip:focus{left:8px}

/* ── cabecera ── */
.hero{background:var(--rojo);color:var(--manteca);padding:clamp(28px,7vw,56px) var(--gutter) clamp(24px,5vw,40px)}
.hero-in{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-end}
.logo{width:min(64vw,280px);color:var(--manteca)}
.logo svg{display:block;width:100%;height:auto}
.tagline{font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.8;color:rgba(244,233,206,.92)}

/* ── navegación de secciones ── */
.nav{position:sticky;top:0;z-index:20;background:var(--manteca);border-bottom:1px solid var(--linea)}
.nav ul{list-style:none;display:flex;gap:4px;max-width:960px;margin:0 auto;padding:6px var(--gutter);overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;min-height:44px;padding:0 14px;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap;border-radius:999px;color:var(--azul);transition:background-color .15s,color .15s}
.nav a:hover{background:rgba(204,23,23,.1)}
.nav a[aria-current="true"]{background:var(--rojo);color:var(--manteca)}

/* ── carta ── */
main{max-width:960px;margin:0 auto;padding:8px var(--gutter) 48px}
.sec{padding-top:36px;scroll-margin-top:60px}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.sec-head h2{font-size:clamp(22px,5vw,28px);color:var(--rojo);line-height:1.1}
.sec-head i{flex:1;height:1px;background:var(--rojo);opacity:.3}
.sec-nota{font-size:14px;color:var(--azul-suave);margin-bottom:6px}
.grid{list-style:none;display:grid;grid-template-columns:1fr}
.item{padding:14px 0;border-bottom:1px solid var(--linea)}
.item-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.item h3{font-size:16px;font-weight:700;line-height:1.25}
.precio{color:var(--rojo);font-weight:700;font-size:16px;white-space:nowrap}
.precio small{font-size:12px;font-weight:700}
.desc{font-size:14px;color:var(--azul-suave);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;list-style:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:rgba(27,46,107,.1);color:var(--azul)}
.tag.cal{background:rgba(204,23,23,.12);color:#9c1010}
.sin-precios .precio{display:none}
@media (min-width:720px){
  .grid{grid-template-columns:1fr 1fr;column-gap:0}
  .item{padding:14px 28px 14px 0}
  .item:nth-child(even){padding:14px 0 14px 28px;border-left:1px solid var(--linea)}
}

/* ── info del local ── */
.info{max-width:960px;margin:0 auto;padding:0 var(--gutter) 40px}
.info-in{display:flex;flex-wrap:wrap;gap:10px}
.info-in:empty{display:none}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:2px solid var(--azul);border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;color:var(--azul);transition:background-color .15s,color .15s}
.btn:hover{background:var(--azul);color:var(--manteca)}
.horarios{font-size:14px;color:var(--azul-suave);margin-top:12px;white-space:pre-line}

/* ── pie ── */
footer{background:var(--azul);color:var(--manteca);padding:28px var(--gutter)}
.foot-in{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
.foot-nota{font-size:13px;opacity:.92}
.foot-logo{width:96px;color:var(--manteca)}
.foot-logo svg{display:block;width:100%;height:auto}
.firma{display:block;max-width:960px;margin:20px auto 0;font-family:"Bebas Neue",Impact,sans-serif;font-size:18px;letter-spacing:.06em;color:#ff4e01;text-decoration:none}

/* ── la abuela ── */
.hero{position:relative;overflow:hidden}
.hero-in{position:relative}
.abuela{position:absolute;right:max(var(--gutter),calc((100vw - 960px)/2 + 8px));top:clamp(10px,2.5vw,22px);width:clamp(84px,22vw,140px);height:auto;pointer-events:none;will-change:transform}
.hero-txt{position:relative;z-index:1}
.tagline{max-width:62%}
@media (min-width:720px){.tagline{max-width:none}.hero-in{padding-right:clamp(90px,16vw,170px)}}
.logo{width:min(52vw,280px)}

/* ── preloader con el logo ── */
.pre{position:fixed;inset:0;z-index:1000;background:var(--rojo);display:flex;align-items:center;justify-content:center;transition:transform .8s cubic-bezier(.76,0,.24,1)}
.pre.out{transform:translateY(-100%)}
.pre-logo{width:min(62vw,300px);color:var(--manteca)}
.pre-logo svg{display:block;width:100%;height:auto;overflow:visible}
.pre-logo path{transform-box:fill-box;transform-origin:50% 100%;animation:letra .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*110ms + 120ms)}
@keyframes letra{from{opacity:0;transform:translateY(55%) scaleY(.7)}to{opacity:1;transform:none}}
.pre-hecho .pre{display:none}
html.pre-activo,html.pre-activo body{overflow:hidden}

/* ── transiciones de entrada ── */
.js .hero .logo,.js .hero .tagline,.js .hero .abuela{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.js .hero .tagline{transition-delay:.12s}
.js .hero .abuela{transform:translateY(40px);transition-delay:.2s,.2s}
.js.listo .hero .logo,.js.listo .hero .tagline,.js.listo .hero .abuela{opacity:1;transform:none}
.js .rev{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.js .rev.vis{opacity:1;transform:none}
.nav a{transition:background-color .2s,color .2s,transform .2s}
.nav a:active{transform:scale(.96)}
.item{transition:background-color .2s}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}*{transition:none!important;animation:none!important}
  .js .hero .logo,.js .hero .tagline,.js .hero .abuela,.js .rev{opacity:1!important;transform:none!important}
}
</style>
</head>

<script>
/* ──────────────────────────────────────────────────────────────
   Carta LUGO — administrada desde una planilla de Google.
   1. Importá carta-lugo.xlsx a Google Sheets.
   2. Compartila: "Cualquier persona con el enlace: Lector".
   3. Pegá el ID (lo que va entre /d/ y /edit) en SHEET_ID.
   Si SHEET_ID está vacío, o Google no responde, se usa la última
   versión guardada en el celular o el RESPALDO de abajo.
   ────────────────────────────────────────────────────────────── */
const SHEET_ID = "";

: 2400, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "brownies", "nombre": "Chocolate blanco", "descripcion": "Brownie de chocolate blanco", "precio": 2400, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "brownies", "nombre": "Brownie de centeno", "descripcion": "Brownie con harina de centeno", "precio": 7500, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "tortas", "nombre": "Cheesecake frutos rojos", "descripcion": "Cheesecake cremoso con salsa de frutos rojos", "precio": 35000, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "tortas", "nombre": "Cheesecake pistachos", "descripcion": "Cheesecake cremoso con pistachos", "precio": 45000, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "tortas", "nombre": "Key lime pie", "descripcion": "Tarta de lima con base de galleta", "precio": 35000, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}, {"seccion_id": "tortas", "nombre": "Vasca", "descripcion": "Torta vasca de queso, cremosa y con costra tostada", "precio": 30000, "unidad": "", "peso": "", "horno": "", "tiempo": "", "disponible": "SI"}]};

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = (n) => "$" + Number(n).toLocaleString("es-AR");

/* ── CSV (formato gviz) ── */
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ""));
}
function tabla(csv) {
  const [cab, ...datos] = parseCSV(csv);
  const k = cab.map((h) => h.trim().toLowerCase());
  return datos.map((f) => Object.fromEntries(k.map((h, i) => [h, (f[i] ?? "").trim()])));
}
function numero(v) {
  if (v === "" || v == null) return "";
  let s = String(v).replace(/[^\d.,]/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 0 && /\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
  const n = parseFloat(s);
  return isNaN(n) ? "" : n;
}

/* ── planilla → modelo ── */
const urlHoja = (n) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`;
const CLAVE_CACHE = "lugo-carta:" + SHEET_ID;
const leerCache = () => { try { return JSON.parse(localStorage.getItem(CLAVE_CACHE)); } catch { return null; } };
const guardarCache = (d) => { try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(d)); } catch {} };

async function traer(nombre) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 7000);
  try {
    const r = await fetch(urlHoja(nombre), { signal: ctrl.signal });
    if (!r.ok) throw new Error(r.status);
    return tabla(await r.text());
  } finally { clearTimeout(t); }
}
async function desdePlanilla() {
  const [carta, secs, conf] = await Promise.all([traer("Carta"), traer("Secciones"), traer("Config")]);
  const config = Object.fromEntries(conf.map((r) => [r.clave, r.valor]));
  const secciones = secs.filter((s) => s.seccion_id).map((s) => ({ seccion_id: s.seccion_id, titulo: s.titulo || s.seccion_id, nota: s.nota || "" }));
  const items = carta.filter((r) => r.nombre && r.seccion_id).map((r) => ({
    seccion_id: r.seccion_id, nombre: r.nombre, descripcion: r.descripcion || "",
    precio: numero(r.precio), unidad: r.unidad || "", peso: r.peso || "", horno: r.horno || "", tiempo: r.tiempo || "",
    disponible: (r.disponible || "SI").toUpperCase(),
  }));
  if (!secciones.length || !items.length) throw new Error("planilla vacía");
  return { config, secciones, items };
}

/* ── dibujo ── */
function dibujar(d) {
  const c = d.config || {};
  document.title = `Carta ${c.nombre || "LUGO"} — Panadería y repostería congelada`;
  $("tagline").innerHTML = (c.tagline || "").split("|").map(esc).join("<br>");
  $("nota").textContent = c.nota_pie || "";
  document.body.classList.toggle("sin-precios", String(c.mostrar_precios || "SI").toUpperCase() === "NO");

  const visibles = d.items.filter((i) => i.disponible !== "NO");
  const secs = d.secciones.map((s) => ({ ...s, items: visibles.filter((i) => i.seccion_id === s.seccion_id) })).filter((s) => s.items.length);

  $("nav").innerHTML = secs.map((s) => `<li><a href="#s-${esc(s.seccion_id)}" data-id="s-${esc(s.seccion_id)}">${esc(s.titulo)}</a></li>`).join("");
  $("carta").innerHTML = secs.map((s) => `
    <section class="sec" id="s-${esc(s.seccion_id)}" aria-labelledby="h-${esc(s.seccion_id)}">
      <div class="sec-head"><h2 id="h-${esc(s.seccion_id)}">${esc(s.titulo)}</h2><i></i></div>
      ${s.nota ? `<p class="sec-nota">${esc(s.nota)}</p>` : ""}
      <ul class="grid">${s.items.map((i) => `
        <li class="item">
          <div class="item-head">
            <h3>${esc(i.nombre)}</h3>
            ${i.precio !== "" ? `<span class="precio">${peso(i.precio)}${i.unidad ? ` <small>${esc(i.unidad)}</small>` : ""}</span>` : ""}
          </div>
          ${i.descripcion ? `<p class="desc">${esc(i.descripcion)}</p>` : ""}
          ${(i.peso || i.horno || i.tiempo) ? `<ul class="tags">${[i.peso && `<li class="tag">${esc(i.peso)}</li>`, i.horno && `<li class="tag cal">${esc(i.horno)}</li>`, i.tiempo && `<li class="tag cal">${esc(i.tiempo)}</li>`].filter(Boolean).join("")}</ul>` : ""}
        </li>`).join("")}</ul>
    </section>`).join("");

  // info del local: solo aparece lo que está cargado
  const ig = (c.instagram || "").replace(/^@/, "").trim();
  const wa = (c.whatsapp || "").replace(/\D/g, "");
  const mapa = c.mapa || (c.direccion ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.direccion) : "");
  $("info").innerHTML = [
    ig && `<a class="btn" href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">Instagram @${esc(ig)}</a>`,
    wa && `<a class="btn" href="https://wa.me/${wa}" target="_blank" rel="noopener">Escribinos por WhatsApp</a>`,
    mapa && `<a class="btn" href="${esc(mapa)}" target="_blank" rel="noopener">Cómo llegar</a>`,
  ].filter(Boolean).join("");
  $("horarios").textContent = c.horarios || "";

  espiar();
  revelar();
}

/* ── scroll-spy ── */
let obs;
function espiar() {
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll("#nav a")];
  obs = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.removeAttribute("aria-current"));
      const a = links.find((x) => x.dataset.id === e.target.id);
      if (a) { a.setAttribute("aria-current", "true"); a.scrollIntoView({ block: "nearest", inline: "center" }); }
    });
  }, { rootMargin: "-80px 0px -55% 0px" });
  if (!links.some((a) => a.hasAttribute("aria-current")) && links[0]) links[0].setAttribute("aria-current", "true");
  document.querySelectorAll(".sec").forEach((s) => obs.observe(s));
}

/* ── preloader, entrada y revelado ── */
const SIN_MOVIMIENTO = matchMedia("(prefers-reduced-motion: reduce)").matches;
let revObs;
function revelar() {
  if (revObs) revObs.disconnect();
  const els = [...document.querySelectorAll(".sec-head,.sec-nota,.item")];
  if (SIN_MOVIMIENTO || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("vis")); return; }
  // escalonado dentro de cada sección (máx. 6 pasos)
  document.querySelectorAll(".sec").forEach((sec) => {
    sec.querySelectorAll(".sec-head,.sec-nota,.item").forEach((e, i) => { e.classList.add("rev"); e.style.setProperty("--d", Math.min(i, 6) * 45 + "ms"); });
  });
  revObs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("vis"); revObs.unobserve(e.target); } }),
    { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
  els.forEach((e) => revObs.observe(e));
}

function entrar() { document.documentElement.classList.add("listo"); }
(function preloader() {
  const html = document.documentElement, pre = $("pre");
  if (!pre || html.classList.contains("pre-hecho")) { entrar(); return; }
  html.classList.add("pre-activo");
  pre.querySelectorAll("path").forEach((p, i) => p.style.setProperty("--i", i));
  const cerrar = () => {
    try { sessionStorage.setItem("lugo-pre", "1"); } catch {}
    pre.classList.add("out");
    entrar();
    setTimeout(() => { html.classList.remove("pre-activo"); pre.remove(); }, 900);
  };
  const minimo = new Promise((r) => setTimeout(r, 1300));
  const fuentes = (document.fonts && document.fonts.ready) || Promise.resolve();
  Promise.race([Promise.all([minimo, fuentes]), new Promise((r) => setTimeout(r, 2800))]).then(cerrar);
})();

/* ── parallax suave de la abuela ── */
(function parallax() {
  const a = $("abuela"); if (!a || SIN_MOVIMIENTO) return;
  let t = false;
  addEventListener("scroll", () => {
    if (t) return; t = true;
    requestAnimationFrame(() => { const y = Math.min(scrollY, 400); a.style.translate = `0 ${y * 0.18}px`; t = false; });
  }, { passive: true });
})();

/* ── arranque: caché o respaldo al instante, planilla en segundo plano ── */
(async function () {
  dibujar((SHEET_ID && leerCache()) || RESPALDO);
  if (!SHEET_ID) return;
  try { const d = await desdePlanilla(); guardarCache(d); dibujar(d); } catch (e) { /* queda lo que ya se ve */ }
})();
</script>
